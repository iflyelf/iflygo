#=================================================
# https://github.com/iflyelf/iflygo-docker
# Lisence: MIT
# Author: iflyelf
# Blog: https://www.xiaonuo.live
#
# Windows 平台构建 (amd64 + arm64)
#   1. 在 Linux 上交叉编译 Windows 二进制 (amd64 + arm64)
#   2. 打包二进制 zip 并发布到 GitHub Release
#   3. 在 windows-2022 runner 上构建 Windows amd64 容器镜像并推送
#
# 注: Windows arm64 容器镜像需要 windows-11-arm runner + Docker,
#     该 runner 默认未预装 Docker, 故 arm64 仅发布二进制 zip
#=================================================

name: 自动编译并发布 Windows 二进制和镜像

# 设置触发条件
on:
  # 编辑文件触发开始编译
  push:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - '.github/workflows/docker-publish-windows.yml'
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      build:
        description: 'build iflygo windows'
        required: true
        default: 'build iflygo windows'
  # 点☆Star触发开始编译
  watch:
    types: [started]

# 任务集
jobs:
  # ============================================================
  # 阶段一: 在 Linux 上交叉编译 Windows 二进制 (amd64 + arm64)
  # ============================================================
  build-windows-binaries:
    name: 编译 Windows 二进制 (${{ matrix.GOARCH }})
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - GOARCH: amd64
            DISPLAY_NAME: x64
          - GOARCH: arm64
            DISPLAY_NAME: ARM64
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 拉取上游 Nebula 源码并品牌化
        shell: bash
        run: |
          set -eux
          IFLYGO_UPSTREAM_VERSION="${IFLYGO_UPSTREAM_VERSION:-v1.10.3}"
          IFLYGO_BRAND="iflygo"
          BRAND_TITLE="iFlyGo"

          git clone --depth=1 -b "${IFLYGO_UPSTREAM_VERSION}" \
              https://github.com/slackhq/nebula.git /tmp/upstream
          cd /tmp/upstream
          git rev-parse HEAD > /tmp/COMMIT

          # 品牌化替换 (与 Dockerfile 保持一致)
          grep -rln --include="*.go" --exclude-dir=vendor 'nebula1' . | while read -r f; do
            sed -i 's|nebula1|'"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          grep -rln --include="*.go" --exclude-dir=vendor -e '/etc/nebula' -e '/var/log/nebula' . | while read -r f; do
            sed -i \
              -e 's|/etc/nebula|/etc/'"${IFLYGO_BRAND}"'|g' \
              -e 's|/var/log/nebula|/var/log/'"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          grep -rln --include="*.go" --exclude-dir=vendor \
              -e '"Nebula' -e '"nebula version' -e 'nebula -config' -e 'Usage of nebula' . | while read -r f; do
            sed -i \
              -e 's|"Nebula|"'"${BRAND_TITLE}"'|g' \
              -e 's|"nebula version|"'"${IFLYGO_BRAND}"' version|g' \
              -e 's|nebula -config|'"${IFLYGO_BRAND}"' -config|g' \
              -e 's|Usage of nebula|Usage of '"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          [ -f cmd/nebula/main.go ] && sed -i 's|"nebula"|"'"${IFLYGO_BRAND}"'"|g' cmd/nebula/main.go || true
          [ -f cmd/nebula-cert/main.go ] && sed -i 's|"nebula-cert"|"'"${IFLYGO_BRAND}"'-cert"|g' cmd/nebula-cert/main.go || true

      - name: 编译 Windows 二进制
        shell: bash
        run: |
          set -eux
          cd /tmp/upstream
          BUILD_NUMBER=$(cat /tmp/COMMIT)
          LDFLAGS="-w -s -X main.Build=${BUILD_NUMBER}"
          OUT_DIR="/tmp/iflygo-windows-${{ matrix.GOARCH }}"
          mkdir -p "${OUT_DIR}"

          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.GOARCH }} \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${OUT_DIR}/iflygo.exe" ./cmd/nebula
          CGO_ENABLED=0 GOOS=windows GOARCH=${{ matrix.GOARCH }} \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${OUT_DIR}/iflygo-cert.exe" ./cmd/nebula-cert
          ls -lh "${OUT_DIR}"

      - name: 拷贝配置模板与说明
        shell: bash
        run: |
          set -eux
          OUT_DIR="/tmp/iflygo-windows-${{ matrix.GOARCH }}"
          cp "${GITHUB_WORKSPACE}/conf/server/config.yml" "${OUT_DIR}/server-config-template.yml"
          cp "${GITHUB_WORKSPACE}/conf/client/config.yml" "${OUT_DIR}/client-config-template.yml"
          cat > "${OUT_DIR}/README-windows.txt" <<EOF
          iFlyGo Windows 原生二进制 (${{ matrix.DISPLAY_NAME }})
          =====================================================
          GitHub: https://github.com/iflyelf/iflygo-docker

          文件说明:
            iflygo.exe                    主程序
            iflygo-cert.exe               证书工具
            server-config-template.yml    Server 配置模板
            client-config-template.yml    Client 配置模板

          使用方法:
            1. 将 iflygo.exe / iflygo-cert.exe 解压到 C:\\iflygo\\
            2. 安装 Wintun 驱动 (https://www.wintun.net/)
               将 wintun.dll 放到 C:\\iflygo\\ 或系统 PATH 目录
            3. 从 server 获取 ca.crt, 并签发本机客户端证书
            4. 参考 client-config-template.yml 创建 C:\\iflygo\\config.yml
            5. 以管理员权限运行:
                 C:\\iflygo\\iflygo.exe -config C:\\iflygo\\config.yml

          注意:
            - 需要管理员权限创建 TUN 虚拟网卡
            - 防火墙需放行 UDP 6688 端口 (入站规则)
          EOF
          ls -lh "${OUT_DIR}"

      - name: 打包 zip
        shell: bash
        run: |
          set -eux
          cd /tmp
          zip -r -j "iflygo-windows-${{ matrix.GOARCH }}.zip" "iflygo-windows-${{ matrix.GOARCH }}"
          ls -lh /tmp/iflygo-windows-${{ matrix.GOARCH }}.zip

      - name: 上传二进制 artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: iflygo-windows-${{ matrix.GOARCH }}-zip
          path: /tmp/iflygo-windows-${{ matrix.GOARCH }}.zip
          retention-days: 30

      - name: 上传裸二进制 artifact (供后续构建容器使用)
        uses: actions/upload-artifact@v4
        with:
          name: iflygo-windows-${{ matrix.GOARCH }}-bin
          path: /tmp/iflygo-windows-${{ matrix.GOARCH }}/*.exe
          retention-days: 1

  # ============================================================
  # 阶段二: 在 windows-2022 runner 上构建 Windows amd64 容器镜像
  # ============================================================
  build-image-amd64:
    name: 构建 Windows amd64 容器镜像
    needs: build-windows-binaries
    runs-on: windows-2022
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 amd64 二进制
        uses: actions/download-artifact@v4
        with:
          name: iflygo-windows-amd64-bin
          path: ./bin

      - name: 列出二进制文件
        shell: pwsh
        run: |
          Get-ChildItem -Path ./bin -Recurse

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送 Windows amd64 镜像
        shell: pwsh
        run: |
          docker build `
            -f Dockerfile.windows `
            --build-arg WINDOWS_BASE_TAG=ltsc2022 `
            -t ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-amd64 `
            -t ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-latest `
            .
          docker push ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-amd64
          docker push ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-latest

  # ============================================================
  # 阶段三: 汇总所有 zip, 发布到 GitHub Release
  # ============================================================
  release:
    name: 发布 Windows 二进制到 GitHub Release
    needs: build-windows-binaries
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: write

    steps:
      - name: 下载所有 zip artifact
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: iflygo-windows-*-zip
          merge-multiple: true

      - name: 查看待发布文件
        shell: bash
        run: ls -lhR ./dist

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: iFlyGo Windows 二进制 (最新)
          body: |
            iFlyGo Windows 原生二进制 (amd64 / arm64)

            - `iflygo-windows-amd64.zip` - 适用于 x64 CPU 的 Windows
            - `iflygo-windows-arm64.zip` - 适用于 ARM64 CPU 的 Windows (Copilot+ PC)

            解压后参考压缩包内 `README-windows.txt` 使用。

            ---

            **Windows 容器镜像** (仅 amd64):
            ```
            docker pull ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-amd64
            ```
          files: ./dist/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # 清理旧的 workflow 记录
  # ============================================================
  cleanup:
    name: 清理旧 workflow
    needs:
      - build-image-amd64
      - release
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: 删除旧的 GitHub-workflow
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 0
