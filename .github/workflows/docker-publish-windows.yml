# Lisence: MIT
# Author: iflyelf
# Blog: https://www.xiaonuo.live
#
# Windows amd64 容器镜像构建
#   1. 在 Linux 上交叉编译 Windows amd64 二进制
#   2. 在 windows-2022 runner 上构建并推送 amd64 镜像
#
# 注: Windows arm64 容器镜像因 GitHub runner 限制无法构建
#     ARM64 二进制通过 release-binaries.yml 工作流发布
#=================================================

name: 自动编译并发布 Windows 镜像

# 设置触发条件
on:
  # 编辑文件触发开始编译
  push:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - 'entrypoint.ps1'
      - '.github/workflows/docker-publish-windows.yml'
  # 手动触发工作流
  workflow_dispatch:
    inputs:
      build:
        description: 'build iflygo windows'
        required: true
        default: 'build iflygo windows'
  # 点☆Star触发开始编译
  watch:
    types: [started]

# 任务集
jobs:
  # ============================================================
  # 阶段一: 在 Linux 上交叉编译 Windows amd64 二进制
  # ============================================================
  build-windows-amd64-bin:
    name: 编译 Windows amd64 二进制
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 Dockerfile.windows 提取构建变量
        id: extract_vars
        shell: bash
        run: |
          set -eux
          IFLYGO_UPSTREAM_REPO=$(grep '^ARG IFLYGO_UPSTREAM_REPO=' Dockerfile.windows | cut -d'=' -f2)
          IFLYGO_UPSTREAM_VERSION=$(grep '^ARG IFLYGO_UPSTREAM_VERSION=' Dockerfile.windows | cut -d'=' -f2)
          IFLYGO_BRAND=$(grep '^ARG IFLYGO_BRAND=' Dockerfile.windows | head -1 | cut -d'=' -f2)
          IFLYGO_BRAND_TITLE=$(grep '^ARG IFLYGO_BRAND_TITLE=' Dockerfile.windows | cut -d'=' -f2)
          GO_VERSION=$(grep '^ARG GO_VERSION=' Dockerfile.windows | cut -d'=' -f2)
          
          echo "IFLYGO_UPSTREAM_REPO=${IFLYGO_UPSTREAM_REPO}" >> $GITHUB_OUTPUT
          echo "IFLYGO_UPSTREAM_VERSION=${IFLYGO_UPSTREAM_VERSION}" >> $GITHUB_OUTPUT
          echo "IFLYGO_BRAND=${IFLYGO_BRAND}" >> $GITHUB_OUTPUT
          echo "IFLYGO_BRAND_TITLE=${IFLYGO_BRAND_TITLE}" >> $GITHUB_OUTPUT
          echo "GO_VERSION=${GO_VERSION}" >> $GITHUB_OUTPUT

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.extract_vars.outputs.GO_VERSION }}

      - name: 拉取上游 Nebula 源码并品牌化
        shell: bash
        env:
          IFLYGO_UPSTREAM_REPO: ${{ steps.extract_vars.outputs.IFLYGO_UPSTREAM_REPO }}
          IFLYGO_UPSTREAM_VERSION: ${{ steps.extract_vars.outputs.IFLYGO_UPSTREAM_VERSION }}
          IFLYGO_BRAND: ${{ steps.extract_vars.outputs.IFLYGO_BRAND }}
          BRAND_TITLE: ${{ steps.extract_vars.outputs.IFLYGO_BRAND_TITLE }}
        run: |
          set -eux
          git clone --depth=1 -b "${IFLYGO_UPSTREAM_VERSION}" \
              "${IFLYGO_UPSTREAM_REPO}" /tmp/upstream
          cd /tmp/upstream
          git rev-parse HEAD > /tmp/COMMIT

          # 品牌化替换
          grep -rln --include="*.go" --exclude-dir=vendor 'nebula1' . | while read -r f; do
            sed -i 's|nebula1|'"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          grep -rln --include="*.go" --exclude-dir=vendor -e '/etc/nebula' -e '/var/log/nebula' . | while read -r f; do
            sed -i \
              -e 's|/etc/nebula|/etc/'"${IFLYGO_BRAND}"'|g' \
              -e 's|/var/log/nebula|/var/log/'"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          grep -rln --include="*.go" --exclude-dir=vendor \
              -e '"Nebula' -e '"nebula version' -e 'nebula -config' -e 'Usage of nebula' . | while read -r f; do
            sed -i \
              -e 's|"Nebula|"'"${BRAND_TITLE}"'|g' \
              -e 's|"nebula version|"'"${IFLYGO_BRAND}"' version|g' \
              -e 's|nebula -config|'"${IFLYGO_BRAND}"' -config|g' \
              -e 's|Usage of nebula|Usage of '"${IFLYGO_BRAND}"'|g' "$f"
          done || true

          [ -f cmd/nebula/main.go ] && sed -i 's|"nebula"|"'"${IFLYGO_BRAND}"'"|g' cmd/nebula/main.go || true
          [ -f cmd/nebula-cert/main.go ] && sed -i 's|"nebula-cert"|"'"${IFLYGO_BRAND}"'-cert"|g' cmd/nebula-cert/main.go || true

      - name: 编译 Windows amd64 二进制
        shell: bash
        run: |
          set -eux
          cd /tmp/upstream
          BUILD_NUMBER=$(cat /tmp/COMMIT)
          LDFLAGS="-w -s -X main.Build=${BUILD_NUMBER}"
          mkdir -p /tmp/out

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o /tmp/out/iflygo.exe ./cmd/nebula
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o /tmp/out/iflygo-cert.exe ./cmd/nebula-cert
          ls -lh /tmp/out

      - name: 上传二进制 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iflygo-windows-amd64-bin
          path: /tmp/out/*.exe
          retention-days: 1

  # ============================================================
  # 阶段二: 在 windows-2022 runner 上构建 Windows amd64 容器镜像
  # ============================================================
  build-image-amd64:
    name: 构建 Windows amd64 容器镜像
    needs: build-windows-amd64-bin
    runs-on: windows-2022
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 amd64 二进制
        uses: actions/download-artifact@v4
        with:
          name: iflygo-windows-amd64-bin
          path: ./bin

      - name: 列出二进制文件
        shell: pwsh
        run: |
          Get-ChildItem -Path ./bin -Recurse

      - name: 登录 DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送 Windows amd64 镜像
        shell: pwsh
        run: |
          docker build `
            -f Dockerfile.windows `
            --build-arg WINDOWS_BASE_TAG=ltsc2022 `
            -t ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-amd64 `
            -t ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-latest `
            .
          docker push ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-amd64
          docker push ${{ secrets.DOCKER_USERNAME }}/iflygo:windows-latest

  # ============================================================
  # 清理旧的 workflow 记录
  # ============================================================
  cleanup:
    name: 清理旧 workflow
    needs: build-image-amd64
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      actions: write
      contents: read
    steps:
      - name: 删除旧的 GitHub-workflow
        uses: Mattraks/delete-workflow-runs@main
        with:
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 0
