name: Web E2E

# 前端端到端回归：真实启动控制台 + PostgreSQL，用 Playwright 覆盖
# 登录、导航、三主题切换、创建网络/客户端。

on:
  push:
    branches: [main]
    paths:
      - 'web/dist/**'
      - 'web/e2e/**'
      - 'cmd/server/**'
      - 'internal/handler/**'
      - '.github/workflows/web-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/dist/**'
      - 'web/e2e/**'
      - 'cmd/server/**'
      - 'internal/handler/**'
      - '.github/workflows/web-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://goproxy.cn,direct
  npm_config_registry: https://registry.npmmirror.com
  PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: Playwright（Chromium）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iflygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iflygo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 安装 Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: grdp 子模块补丁
        run: |
          python3 scripts/patch_grdp.py third_party/grdp
          python3 scripts/patch_nebula.py third_party/nebula

      - name: 前端合并注入
        run: python3 scripts/inject_tunnel_frontend.py

      - name: 编译控制台
        run: |
          go build -o /tmp/iflygo-server ./cmd/server

      - name: 启动控制台
        run: |
          export DATABASE_DRIVER=postgres
          export DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/iflygo?sslmode=disable"
          export SERVER_HOST=127.0.0.1
          export SERVER_PORT=18090
          export ADMIN_USERNAME=admin
          export ADMIN_PASSWORD=admin123
          export SESSION_SECRET=e2e-secret-0123456789abcdef
          nohup /tmp/iflygo-server > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18090/ready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18090/ready

      - name: 安装 Playwright
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 运行 E2E
        working-directory: web/e2e
        env:
          BASE_URL: http://127.0.0.1:18090
        run: npx playwright test

      - name: 失败时输出服务端日志
        if: failure()
        run: tail -200 /tmp/server.log

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
