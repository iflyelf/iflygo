name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  # 测试与静态检查
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iflygo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iflygo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iflygo?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: grdp 子模块补丁（移除 CGO + broken VNC）
        run: |
          python3 scripts/patch_grdp.py third_party/grdp
          python3 scripts/patch_nebula.py third_party/nebula

      - name: 前端合并注入（upgrade_mgr 前端 + 隧道/DDNSTO/Liaison 视图）
        run: python3 scripts/inject_tunnel_frontend.py

      - name: 前端语法检查
        run: node --check web/dist/assets/app.js

      - name: Go 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test -p 1 ./...

      - name: 并发竞态检查（-race）
        run: go test -race -p 1 ./...

  # 多架构二进制（push/tag 作为发布产物，PR 作为编译校验）
  build:
    name: 编译 ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64 }
          - { os: linux,   arch: arm64 }
          - { os: linux,   arch: arm   }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin,  arch: amd64 }
          - { os: darwin,  arch: arm64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: 安装 Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: grdp 子模块补丁
        run: |
          python3 scripts/patch_grdp.py third_party/grdp
          python3 scripts/patch_nebula.py third_party/nebula

      - name: 前端合并注入
        run: python3 scripts/inject_tunnel_frontend.py

      - name: 编译 server / client
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(cat VERSION)
          LDFLAGS="-s -w -X github.com/iflyelf/iflygo/internal/version.Version=${VERSION} -X github.com/iflyelf/iflygo/internal/version.Build=${COMMIT} -X github.com/iflyelf/iflygo/internal/version.Commit=${COMMIT}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "bin/iflygo-server-${{ matrix.os }}-${{ matrix.arch }}${ext}" ./cmd/server
          go build -trimpath -ldflags "${LDFLAGS}" -o "bin/iflygo-client-${{ matrix.os }}-${{ matrix.arch }}${ext}" ./cmd/client

      # Windows 客户端/服务端使用 Nebula wintun 驱动；按 exe 期望的
      # <exe 目录>/dist/windows/wintun/bin/<arch>/wintun.dll 布局放入产物。
      - name: 打包 Windows wintun 驱动
        if: matrix.os == 'windows'
        run: |
          arch="${{ matrix.arch }}"
          mkdir -p "bin/dist/windows/wintun/bin/${arch}"
          cp "third_party/nebula/dist/windows/wintun/bin/${arch}/wintun.dll" \
             "bin/dist/windows/wintun/bin/${arch}/wintun.dll"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/

  # 打包并发布：main -> latest Release；tag v* -> 版本 Release
  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: 打包并生成校验和
        run: |
          set -euo pipefail
          cd dist
          for f in iflygo-server-* iflygo-client-*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.tar.gz|*.zip) continue ;;
            esac
            case "$f" in
              *.exe)
                arch=""
                case "$f" in
                  *-amd64.exe) arch=amd64 ;;
                  *-arm64.exe) arch=arm64 ;;
                esac
                dll="dist/windows/wintun/bin/${arch}/wintun.dll"
                if [ -n "$arch" ] && [ -f "$dll" ]; then
                  zip -q "${f%.exe}.zip" "$f" "$dll"
                else
                  zip -q "${f%.exe}.zip" "$f"
                fi
                sha256sum "$f" >> checksums.txt
                sha256sum "${f%.exe}.zip" >> checksums.txt
                ;;
              *) tar -czf "${f}.tar.gz" "$f"; sha256sum "${f}.tar.gz" >> checksums.txt ;;
            esac
          done
          ls -lh

      - name: 发布 Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          # main/手动触发更新 latest；tag 发布使用 tag 名
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          prerelease: false
          make_latest: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/checksums.txt
