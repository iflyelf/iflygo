# iFlyGo 控制面配置示例（Docker Compose 使用）
# 环境变量优先级：页面设置 > 环境变量 > 本文件 > 内置默认值。
server:
  host: 0.0.0.0
  port: 8090
  external_url: http://127.0.0.1:8090
  web_embedded: true
  cookie_secure: auto
  trust_proxy: true
  trusted_proxies: ["127.0.0.1", "::1"]
  # session_secret: 建议通过 SESSION_SECRET 环境变量注入

artifact:
  dir: /data/artifacts
  storage_type: local
  max_concurrent_uploads: 4
  lock_wait: 30m

tcp_relay:
  mode: auto          # auto / tcp / udp（客户端默认数据面模式）
  listen: ""          # 留空 = 控制面端口 +1（8091）
  advertise: ""       # 对外可达地址，如 iflygo.example.com:8091
  token: ""           # 可选共享令牌，客户端通过心跳自动获取

client:
  dns: ""             # 客户端默认 DNS（网络级 DNS 优先）
  mtu: 1280           # 客户端默认 MTU
  interval: 30s       # 客户端心跳间隔

log:
  level: info

# 数据库可用 DATABASE_URL 环境变量提供；也可显式写在此处：
# database:
#   driver: postgres
#   dsn: postgresql://iflygo:password@127.0.0.1:5432/iflygo?sslmode=disable
#   max_open_conns: 50
#   max_idle_conns: 10
