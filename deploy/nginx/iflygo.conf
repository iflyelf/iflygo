# iFlyGo 控制面反向代理示例（Nginx 1.20+）
# 注意：
#   1. /api/liaison/ws、/api/agent/* 需要 Upgrade / 长连接超时；
#   2. 制品上传较大，client_max_body_size 按需调整；
#   3. TCP 中继 8091 默认直连；若必须经 Nginx，使用下方 stream 段并设置
#      TCP_RELAY_ADVERTISE=iflygo.example.com:8091。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name iflygo.example.com;
    # ACME HTTP-01 / 强制 HTTPS（按需）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name iflygo.example.com;

    ssl_certificate     /etc/letsencrypt/live/iflygo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iflygo.example.com/privkey.pem;

    client_max_body_size 2g;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Web SSH / VNC / RDP 的 WebSocket：关闭缓冲，避免画面/终端卡顿
    location /api/liaison/ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 可选：TCP 中继经 Nginx 转发（需 nginx 编译 --with-stream）
